# Repo layer of rig's commit-time lint check (`rig lint check`); everything not set here keeps the global defaults.
# This fork carries Snapmaker/OrcaSlicer's sources. Their GUI files are far above the 2400-line error limit
# (src/slic3r/GUI/Plater.cpp has 24910 lines) and cannot be split here without diverging from every upstream merge;
# the names below are the upstream files a fork fix had to grow. The pinned complexity analyzer (cccc) cannot parse
# this C++ (wx/BBS macros), so its check could never pass on these sources.
lint_checks:
  complexity:
    enabled: false
  file_lines:
    exempt_filenames:
      # global defaults, which this list replaces
      - pnpm-lock.yaml
      - go.sum
      - go.work.sum
      # upstream Snapmaker/OrcaSlicer sources
      - plater.cpp
      - glcanvas3d.cpp
      - gui_app.cpp
