name: Update Translation Catalog
on: 
  # schedule:
  #   - cron: 0 0 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_translation:
    permissions:
      contents: write
    name: Update translation
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Update translation catalog
        run: |
          ./scripts/run_gettext.sh --full
          git add localization/i18n/*

      - name: Commit translation catalog updates
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f
        id: commit
        with:
          message: Update translation catalog
          skip-empty: true

      - name: Push changes
        run: git push
